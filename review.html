<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menzza — Review</title>
<meta property="og:title" content="Uma review no Menzza" />
<meta property="og:description" content="Toque pra abrir a publicação no app Menzza." />
<style>
  :root {
    --primary: #8F1D2C;
    --text: #1C1C1E;
    --muted: #6B7280;
    --bg: #FFFFFF;
    --bg-alt: #FBF4F5;
    --border: #E5E7EB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #F0F0F0;
      --muted: #9CA3AF;
      --bg: #17181A;
      --bg-alt: #1F1615;
      --border: #2E2F33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg-alt);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--bg);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  .brand { color: var(--primary); font-weight: 700; font-size: 20px; margin: 0 0 24px; }
  .icon { font-size: 44px; margin: 0 0 12px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.5; margin: 0; }
  .button {
    display: block;
    margin: 24px 0 0;
    padding: 14px 20px;
    border-radius: 12px;
    background: var(--primary);
    color: #FFFFFF;
    font-weight: 600;
    text-decoration: none;
  }
  .divider { margin: 28px 0 12px; font-size: 14px; }
  .store {
    display: block;
    margin: 8px 0 0;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <main class="card">
    <p class="brand">Menzza</p>
    <p class="icon">🍽️</p>
    <h1>Uma review te espera no Menzza</h1>
    <p>Se você já tem o app, ele abre direto na publicação.</p>
    <a id="open" class="button" href="appgastronomico://">Abrir no Menzza</a>

    <p class="divider">Ainda não tem o Menzza?</p>
    <a class="store" href="https://apps.apple.com/app/id6795665354">Baixar na App Store</a>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.appgastronomico.app">Baixar no Google Play</a>
  </main>

  <script>
    // Link compartilhado pelo app (ShareSheet): review.html?id=<uuid da review>.
    // Sem domínio próprio não dá universal link, então esta página só
    // repassa pro esquema do app (appgastronomico://review/<id>, rota
    // app/review/[id].tsx). O id é validado como UUID antes de ir pra URL.
    var id = new URLSearchParams(window.location.search).get("id") || "";
    var isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
    var target = isUuid ? "appgastronomico://review/" + id : "appgastronomico://";
    // Sem abrir sozinho de propósito: no iPhone sem o app, o Safari
    // mostra "endereço inválido" -- e quem recebe pelo WhatsApp muitas
    // vezes ainda não tem o Menzza. Fica o botão.
    document.getElementById("open").href = target;
  </script>
</body>
</html>
