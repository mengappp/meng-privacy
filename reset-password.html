<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menzza — Redefinir senha</title>
<style>
  :root {
    --primary: #8F1D2C;
    --primary-pressed: #6E1522;
    --text: #1C1C1E;
    --muted: #6B7280;
    --border: #E5E5E7;
    --bg: #FFFFFF;
    --bg-alt: #FBF4F5;
    --error: #D92D20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #F0F0F0;
      --muted: #9CA3AF;
      --border: #333333;
      --bg: #17181A;
      --bg-alt: #1F1615;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-alt);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    margin: 24px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
  }
  .wordmark {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    margin: 0 0 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  p.hint {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 16px;
    margin-bottom: 16px;
    background: var(--bg);
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
  }
  button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  button:not(:disabled):active {
    background: var(--primary-pressed);
  }
  .error {
    color: var(--error);
    font-size: 14px;
    margin: 0 0 12px;
  }
  .success {
    font-size: 15px;
    line-height: 1.6;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <p class="wordmark">Menzza</p>

    <div id="stateChecking">
      <h1>Verificando link…</h1>
      <p class="hint">Só um instante.</p>
    </div>

    <div id="stateInvalid" class="hidden">
      <h1>Link inválido ou expirado</h1>
      <p class="hint">Volte pro app do Menzza e peça um novo link em "Esqueci minha senha".</p>
    </div>

    <div id="stateForm" class="hidden">
      <h1>Crie uma nova senha</h1>
      <p class="hint">Mínimo de 6 caracteres.</p>
      <p class="error hidden" id="formError"></p>
      <label for="password">Nova senha</label>
      <input id="password" type="password" autocomplete="new-password" />
      <button id="submitButton">Salvar nova senha</button>
    </div>

    <div id="stateSuccess" class="hidden">
      <h1>Senha alterada!</h1>
      <p class="success">Pode fechar essa página e voltar pro app do Menzza — entre com sua senha nova.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    var SUPABASE_URL = "https://sccqcsyjzgfelinuehgt.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_ybsLAwSxnwWmyWd_1UEFmw_kfgmfBQH";
    var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function show(id) {
      ["stateChecking", "stateInvalid", "stateForm", "stateSuccess"].forEach(function (s) {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    var recoveryReady = false;

    client.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        show("stateForm");
      }
    });

    // Se o evento PASSWORD_RECOVERY não disparar em alguns segundos
    // (link já expirado, ou aberto fora do fluxo de recovery), mostra
    // o estado de link inválido em vez de travar em "verificando".
    setTimeout(function () {
      if (!recoveryReady) show("stateInvalid");
    }, 4000);

    document.getElementById("submitButton").addEventListener("click", async function () {
      var password = document.getElementById("password").value;
      var errorEl = document.getElementById("formError");
      errorEl.classList.add("hidden");

      if (password.length < 6) {
        errorEl.textContent = "A senha precisa ter pelo menos 6 caracteres.";
        errorEl.classList.remove("hidden");
        return;
      }

      var button = document.getElementById("submitButton");
      button.disabled = true;
      button.textContent = "Salvando…";

      var result = await client.auth.updateUser({ password: password });

      if (result.error) {
        var message = result.error.message || "";
        if (message.toLowerCase().indexOf("different from the old password") !== -1) {
          errorEl.textContent = "Essa já é sua senha atual. Digite uma senha diferente.";
        } else {
          errorEl.textContent = "Não deu pra salvar a senha (" + message + "). Tenta pedir um novo link.";
        }
        errorEl.classList.remove("hidden");
        button.disabled = false;
        button.textContent = "Salvar nova senha";
        return;
      }

      show("stateSuccess");
    });
  </script>
</body>
</html>
